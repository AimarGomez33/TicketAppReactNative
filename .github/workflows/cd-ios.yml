name: CD - iOS Continuous Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Entorno de despliegue'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

jobs:
  build-ios-release:
    name: Build & Archive iOS Release (IPA)
    runs-on: macos-15

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🍏 Select Xcode 16.2
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version

      - name: ⚡ Setup pnpm
        uses: pnpm/action-setup@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: 📦 Install Dependencies
        run: pnpm install

      - name: 💎 Setup Ruby & CocoaPods
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: 🔑 Inject Environment Variables (.env)
        env:
          SUPABASE_URL_PROD: ${{ secrets.SUPABASE_URL_PROD || secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY_PROD: ${{ secrets.SUPABASE_ANON_KEY_PROD || secrets.SUPABASE_ANON_KEY }}
          RESTAURANT_NAME: ${{ secrets.RESTAURANT_NAME }}
          PRINTER_HOST: ${{ secrets.PRINTER_HOST }}
          PRINTER_PORT: ${{ secrets.PRINTER_PORT }}
        run: |
          echo "SUPABASE_URL=${SUPABASE_URL_PROD}" >> .env
          echo "SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY_PROD}" >> .env
          echo "RESTAURANT_NAME=\"${RESTAURANT_NAME:-Ticket App POS}\"" >> .env
          echo "PRINTER_HOST=${PRINTER_HOST:-192.168.1.200}" >> .env
          echo "PRINTER_PORT=${PRINTER_PORT:-9100}" >> .env

      - name: 🍎 Install CocoaPods Dependencies
        working-directory: ios
        run: |
          pod install

      - name: 🏗️ Build iOS Release Binary
        working-directory: ios
        run: |
          xcodebuild -workspace TicketAppPOS.xcworkspace \
            -scheme TicketAppPOS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: 📦 Package .IPA Payload
        run: |
          mkdir -p build/Payload
          cp -r ios/build/Build/Products/Release-iphoneos/TicketAppPOS.app build/Payload/
          cd build && zip -r TicketAppPOS.ipa Payload
          cd ..

      - name: 📤 Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ticketapp-ios-release
          path: build/TicketAppPOS.ipa
          retention-days: 14
