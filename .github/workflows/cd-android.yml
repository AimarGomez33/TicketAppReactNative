name: CD - Android Continuous Deployment

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Entorno de despliegue'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

jobs:
  build-android-release:
    name: Build & Sign Android Release (APK & AAB)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚡ Setup pnpm
        uses: pnpm/action-setup@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: 📦 Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: ☕ Setup Java JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🐘 Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: 🔑 Inject Environment Variables (.env)
        env:
          SUPABASE_URL_PROD: ${{ secrets.SUPABASE_URL_PROD || secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY_PROD: ${{ secrets.SUPABASE_ANON_KEY_PROD || secrets.SUPABASE_ANON_KEY }}
          RESTAURANT_NAME: ${{ secrets.RESTAURANT_NAME }}
          PRINTER_HOST: ${{ secrets.PRINTER_HOST }}
          PRINTER_PORT: ${{ secrets.PRINTER_PORT }}
        run: |
          echo "SUPABASE_URL=${SUPABASE_URL_PROD:-https://saywxawfatcewxakwbyi.supabase.co}" >> .env
          echo "SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY_PROD:-sb_publishable_oi5ejOEP4erfTlqZLNdmLQ_ml-LJnCs}" >> .env
          echo "RESTAURANT_NAME=\"${RESTAURANT_NAME:-Antojitos Mexicanos Margarita}\"" >> .env
          echo "PRINTER_HOST=${PRINTER_HOST:-192.168.100.200}" >> .env
          echo "PRINTER_PORT=${PRINTER_PORT:-9100}" >> .env

      - name: 🔐 Decode Keystore (Optional Production Signing)
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          echo "ANDROID_KEYSTORE_FILE=release.keystore" >> $GITHUB_ENV
          echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> $GITHUB_ENV
          echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> $GITHUB_ENV

      - name: 🏗️ Build Android Release APK & AAB
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease bundleRelease

      - name: 📤 Upload Build Artifacts (APK & AAB)
        uses: actions/upload-artifact@v4
        with:
          name: ticketapp-android-release
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: 🚀 Create GitHub Release (On Version Tag)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          generate_release_notes: true
          draft: false
          prerelease: false
